name: Build Wiko Y82 Linux Kernel for Debian 13

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-12 lld-12 llvm-12 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make bc bison flex libssl-dev libelf-dev

      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Clone Unisoc SC9863A Kernel Source
        run: |
          git clone --depth 1 https://github.com/strongtz/linux-sprd.git kernel

      - name: Configure Kernel with Debian Systemd Support
        run: |
          cd kernel
          chmod -R +x scripts/
          find . -name "*.sh" -exec chmod +x {} +
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make ARCH=arm64 sprd_sharkl3_defconfig
          cat << 'EOF' >> .config
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_VT=y
          CONFIG_VT_CONSOLE=y
          CONFIG_NAMESPACES=y
          CONFIG_SYSVIPC=y
          CONFIG_FHANDLE=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_CGROUPS=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF
          make ARCH=arm64 olddefconfig
          sed -i 's/-Werror//g' Makefile
          sed -i 's/-Werror//g' arch/arm64/Makefile

      - name: Compile Kernel Image.gz
        id: compile
        continue-on-error: true
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang-12 CLANG_TRIPLE=aarch64-linux-gnu- KCFLAGS="-w" Image.gz 2>&1 | tail -n 80 > ../error_summary.txt
          test -f arch/arm64/boot/Image.gz

      - name: Save Error Log to Git
        if: steps.compile.outcome != 'success'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -B build-error-log
          cp ../error_summary.txt ./ERROR_SUMMARY.md
          git add ERROR_SUMMARY.md
          git commit -m "docs: error summary log" || true
          git push -f origin build-error-log || true
          exit 1

      - name: Create Release with Kernel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-wiko-y82-debian-kernel
          name: Wiko Y82 (SC9863A) Debian 13 Kernel Image.gz
          files: kernel/arch/arm64/boot/Image.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
