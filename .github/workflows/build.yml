name: Build Wiko Y82 Linux Kernel for Debian 13

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-12 lld-12 llvm-12 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make bc bison flex libssl-dev libelf-dev

      - name: Clone Unisoc SC9863A Kernel Source
        run: |
          git clone --depth 1 https://github.com/strongtz/linux-sprd.git kernel

      - name: Configure Kernel with Debian Systemd Support
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make ARCH=arm64 sprd_sharkl3_defconfig
          cat << 'EOF' >> .config
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_VT=y
          CONFIG_VT_CONSOLE=y
          CONFIG_NAMESPACES=y
          CONFIG_SYSVIPC=y
          CONFIG_FHANDLE=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_CGROUPS=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          EOF
          make ARCH=arm64 olddefconfig
          grep -E "DEVTMPFS|CONFIG_VT" .config || true

      - name: Compile Kernel Image.gz
        run: |
          cd kernel
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) ARCH=arm64 CC=clang-12 CLANG_TRIPLE=aarch64-linux-gnu- Image.gz
          ls -lh arch/arm64/boot/Image.gz

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: kernel/arch/arm64/boot/Image.gz

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5-debian-kernel
          name: Wiko Y82 / SC9863A Debian Kernel Image.gz
          files: kernel/arch/arm64/boot/Image.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
