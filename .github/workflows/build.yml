name: Build Wiko Y82 Linux Kernel for Debian 13

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make bc bison flex libssl-dev libelf-dev

      - name: Checkout Builder Repo
        uses: actions/checkout@v4

      - name: Clone Unisoc SC9863A Kernel Source
        run: |
          git clone --depth 1 -b p20hd https://github.com/ex1tium/linux-teclast-p20hd.git kernel

      - name: Configure Kernel with Debian Systemd Support
        run: |
          cd kernel
          chmod -R +x scripts/
          find . -name "*.sh" -exec chmod +x {} +
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make ARCH=arm64 sprd/sprd_sharkl3_defconfig
          cat << 'EOF' >> .config
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_VT=y
          CONFIG_VT_CONSOLE=y
          CONFIG_NAMESPACES=y
          CONFIG_SYSVIPC=y
          CONFIG_FHANDLE=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_CGROUPS=y
          # CONFIG_ANDROID_PARANOID_NETWORK is not set
          # CONFIG_CC_STACKPROTECTOR_STRONG is not set
          CONFIG_CC_STACKPROTECTOR_NONE=y
          EOF
          make ARCH=arm64 olddefconfig
          sed -i 's/-Werror /-Wno-error /g' Makefile
          sed -i 's/-Werror$/-Wno-error/g' Makefile
          sed -i 's/-Werror /-Wno-error /g' arch/arm64/Makefile
          sed -i 's/HOSTCFLAGS   :=/HOSTCFLAGS   := -fcommon /g' Makefile
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c 2>/dev/null || true
          sed -i 's/dtc-objs.*yamltree.o//g' scripts/dtc/Makefile
          sed -i 's/-I\$(src)\/libfdt/-I\$(src)\/libfdt -DNO_YAML/g' scripts/dtc/Makefile
          sed -i 's/BATTERY_SCUD_SDI,/BATTERY_SCUD_SDI, BATTERY_SCUD_ATL,/g' drivers/power/supply/battery_id_via_adc.h

      - name: Compile Kernel Image.gz with GCC
        run: |
          cd kernel
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w" HOSTCFLAGS="-fcommon" Image.gz 2>&1 | tee ../build.log
          ls -la arch/arm64/boot/Image.gz

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image.gz
          path: kernel/arch/arm64/boot/Image.gz

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
